name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: craftbymanoj.in
  CLOUDFRONT_DISTRIBUTION_ID: E3SYHPH1KSKYZI

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::783764602401:role/GitHubPortfolioDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --cache-control "public,max-age=31536000"
          aws s3 cp index.html s3://${{ env.S3_BUCKET }}/index.html --cache-control "public,max-age=300" --content-type "text/html"
          aws s3 cp project.html s3://${{ env.S3_BUCKET }}/project.html --cache-control "public,max-age=300" --content-type "text/html"
          aws s3 cp sitemap.xml s3://${{ env.S3_BUCKET }}/sitemap.xml --cache-control "public,max-age=300" --content-type "application/xml"
          aws s3 cp robots.txt s3://${{ env.S3_BUCKET }}/robots.txt --cache-control "public,max-age=300" --content-type "text/plain"
          aws s3 cp llm.txt s3://${{ env.S3_BUCKET }}/llm.txt --cache-control "public,max-age=300" --content-type "text/plain"
          aws s3 cp llms.txt s3://${{ env.S3_BUCKET }}/llms.txt --cache-control "public,max-age=300" --content-type "text/plain"
          aws s3 cp projects s3://${{ env.S3_BUCKET }}/projects --recursive --exclude "*" --include "*.html" --cache-control "public,max-age=300" --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
