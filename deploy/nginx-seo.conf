# ================================================================
# SEO-related server config — NOT auto-applied.
# This repo is static files only; these directives must be pasted
# into the nginx config on the actual host (the AWS VM) and reloaded
# with `sudo nginx -t && sudo systemctl reload nginx`.
# ================================================================

# ---- 1. Force http -> https and non-www -> www (apex to www) ----
# Put this in its own server block that only exists to redirect.
server {
    listen 80;
    listen [::]:80;
    server_name craftbymanoj.in www.craftbymanoj.in;
    return 301 https://www.craftbymanoj.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name craftbymanoj.in;

    # reuse your existing cert (must cover the apex domain too)
    ssl_certificate     /etc/letsencrypt/live/craftbymanoj.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craftbymanoj.in/privkey.pem;

    return 301 https://www.craftbymanoj.in$request_uri;
}

# ---- 2. Your main site block (www) — add the two blocks below ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.craftbymanoj.in;

    root /var/www/craftbymanoj;   # <-- adjust to your actual deploy path
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/craftbymanoj.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craftbymanoj.in/privkey.pem;

    # Long-lived caching for static, hashed/rarely-changing assets
    # (fixes "Caching headers: PARTIAL" in the SEO audit)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML should NOT be cached long — content changes on every deploy
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
